name: build

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags="-s -w -H windowsgui" -o syntee-launcher.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: syntee-launcher-windows-amd64
          path: syntee-launcher.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: syntee-launcher.exe
          generate_release_notes: true
